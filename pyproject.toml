[project]
name = "flowr"
version = "0.1.0"
description = "FlowR: Flowing from Sparse to Dense 3D Reconstructions"
readme = "README.md"
authors = [
  { name="Tobias Fischer", email="tobias.fischer@inf.ethz.ch" },
]
license = { text="Apache 2.0"}
requires-python = ">=3.10.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
]

dependencies = [
    "accelerate>=1.2.1",
    "bitsandbytes>=0.45.0",
    "click",
    "diffusers>=0.32.2",
    "einops>=0.8.0",
    "gsplat>=1.4.0",
    "huggingface_hub",
    "hydra-core>=1.3.2",
    "faiss-cpu",
    "jaxtyping>=0.2.36",
    "kapture",
    "kapture-localization",
    "lpips==0.1.4",
    "matplotlib",
    "mediapy>=1.2.2",
    "nerfstudio>=1.1.5",
    "numpy==1.26.4",
    "opencv-python",
    "pandas",
    "Pillow",
    "plyfile",
    "pycolmap",
    "pytorch-msssim",
    "PyYAML",
    "rich",
    "roma",
    "safetensors",
    "scipy",
    "scikit-learn",
    "torchmetrics",
    "tqdm",
    "transformers>=4.49.0",
    "typing_extensions>=4.12.2",
    "tyro>=0.9.8",
]

[project.optional-dependencies]
# Optional heavy dependencies (visualization, MASt3R pointclouds, metrics)
extra = [
    "rerun-sdk>=0.21.0",
]
dev = [
    "black[jupyter]==23.3.0",
    "isort==5.10.1",
    "pre-commit==3.3.2",
    "pytest==7.1.2",
    "pytest-xdist==2.5.0",
    "ruff==0.1.13",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"*" = ["*.cu", "*.json", "py.typed", "setup.bash", "setup.zsh"]

# code check, test options
[tool.pyright]
include = ["src/flowr"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "data/*"
]
defineConstant = { DEBUG = true }

reportMissingImports = "warning"
reportMissingTypeStubs = false
reportPrivateImportUsage = false

pythonVersion = "3.10"
pythonPlatform = "Linux"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
lint.select = [
    "E",  # pycodestyle errors.
    "F",  # Pyflakes rules.
    "PLC",  # Pylint convention warnings.
    "PLE",  # Pylint errors.
    "PLR",  # Pylint refactor recommendations.
    "PLW",  # Pylint warnings.
]
lint.ignore = [
    "E731",  # lambda expression
    "E501",  # Line too long.
    "F722",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "PLR2004",  # Magic value used in comparison.
    "PLR0915",  # Too many statements.
    "PLR0913",  # Too many arguments.
    "PLC0414",  # Import alias does not rename variable. (this is used for exporting names)
    "PLC1901",  # Use falsey strings.
    "PLR5501",  # Use `elif` instead of `else if`.
    "PLR0911",  # Too many return statements.
    "PLR0912",  # Too many branches.
    "PLW0603",  # Globa statement updates are discouraged.
    "PLW2901",  # For loop variable overwritten.
]

[tool.pytest.ini_options]
addopts = "-n=4"
testpaths = [
    "tests",
]