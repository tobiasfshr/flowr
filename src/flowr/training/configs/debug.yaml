# FlowR: Debug config for quick iteration
# Usage: python -m flowr.training.trainer --config-name=debug.yaml
defaults:
  - /config
  - defaults

hydra:
  job:
    name: debug

# model
model_cls: MultiViewFlowModel
load_rays: True
num_ref_images: 2
num_tgt_images: 1
num_total_images: 3

# training
max_train_steps: 500
validation_steps: 100
num_validation_images: 5
checkpoints_total_limit: 1
checkpointing_steps: 250
train_batch_size: 1
use_8bit_adam: True
learning_rate: 1e-4
lr_scheduler: "constant"
lr_warmup_steps: 50

# data
dataloader_num_workers: 2
data_dir:
  - data/processed/DL3DV
test_split_paths:
  - assets/dl3dv140.txt
invalid_sequences_files: []
max_inference_images:
  - 15
resolution: 64
psnr_bounds: [5.0, 34.0]

# logging
experiment_logger:
  - tensorboard
